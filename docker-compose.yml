# PostgreSQL para los módulos 11 en adelante.
# Uso: docker compose up -d   |   docker compose down
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: curso
      POSTGRES_PASSWORD: curso
      POSTGRES_DB: tareas
    ports:
      - '5432:5432'
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U curso -d tareas']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  datos-postgres:
